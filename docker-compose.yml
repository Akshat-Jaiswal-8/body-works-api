services:
  db:
    image: postgres:17
    container_name: body-works-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'

  body-works-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: body-works-api
    ports:
      - '8000:8000'
    env_file:
      - .env
    restart: unless-stopped
